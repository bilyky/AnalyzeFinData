[tool.ruff]
# Target Python version
target-version = "py312"

# Permissive line length to accommodate long HTML templates and verbose comments
line-length = 150

# File filtering and exclusions
exclude = [
    ".git",
    ".idea",
    ".ruff_cache",
    "venv",
    "venv_new",
]

[tool.ruff.lint]
# Enable strict, production-grade rules aligning with AGENT.md
# E: pycodestyle errors
# F: Pyflakes errors (finds unused imports, dead variables)
# B: flake8-bugbear (logic traps and loop anomalies)
# T201: flake8-print (strictly blocks raw print statement leaks)
# E402: module-import-not-at-top-of-file (strictly enforces No-Inline-Imports Standard)
# E722: bare-except (strictly blocks bare exception swallowing)
# S110: flake8-bandit try-except-pass (blocks silent exception swallowing pass blocks)
# I: isort (automatically organizes, merges, and sorts imports globally)
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "T201",   # flake8-print
    "E402",   # module-import-not-at-top-of-file
    "E722",   # bare-except
    "S110",   # try-except-pass
    "I",      # isort
]

# Ignore formatting-only style rules to focus strictly on structural and logical integrity
ignore = [
    "E501",   # Line too long (already mitigated via line-length but ignored completely for comments/HTML)
    "E701",   # Multiple statements on one line (colon) — permits standard short-hand statements (e.g. 'if not x: continue')
]

[tool.ruff.lint.per-file-ignores]
# Decouple and exempt legacy, utility, and test files cleanly in pyproject.toml
"aether/etrade.py" = ["T201", "E402"]          # Print statements allowed for E*TRADE verifier console prompts; inline import for reauth lock
"etrade.py" = ["T201", "E402"]                 # Roots wrapper file inherits exemptions
"powergauge.py" = ["T201", "E402"]             # Playwright manual logins require prints/inline imports
"run_history.py" = ["T201", "E402"]            # Parallel history backfill script
"verify_data_contiguity.py" = ["T201"]         # Terminal auditing script is built on console prints
"scripts/utils/repair_pg_history.py" = ["T201"] # Repair terminal script
"tests/*" = ["T201", "E402", "S110", "F401"]   # Test files require print/inline imports, exception-pass, and optional unused imports
"daily_task.py" = ["T201"]                      # Command-line diagnostics uses standard print

[tool.ruff.lint.isort]
# Organize imports cleanly at top-of-file
force-single-line = false
lines-after-imports = 2
