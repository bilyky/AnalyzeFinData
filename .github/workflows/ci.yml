name: CI

# First CI gate for AETHER. Deliberately dependency-free so it is fast, green, and
# portable on a Linux runner.
#
# The unit suite runs in the `tests` job on windows-latest: the app imports MetaTrader5,
# which only installs on Windows, and requirements-ci.txt pins the exact package set the
# suite passes on locally (R&D #78 S1b). The tests are hermetic (tests/__init__.py
# redirects Data/ paths and blocks network, browsers and process kills), so no secrets or
# live data are needed. `quality-gate` and `lint` stay dependency-free on Linux.

on:
  pull_request:
    branches: [ main ]
  # Also run on push to feature branches — NOT just on the PR. A PR opened by the Auto-PR
  # workflow's GITHUB_TOKEN does not trigger `pull_request` runs (GitHub's recursion
  # guard), so gating on push is what guarantees every bot-opened PR is still checked.
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'ci/**'
      - 'docs/**'
      - 'perf/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Byte-compile all tracked Python (syntax gate)
        run: git ls-files '*.py' | xargs -r python -m py_compile

      - name: AETHER pre-commit validator (against the change set)
        shell: bash
        run: |
          # The validator inspects the STAGED diff (index vs HEAD). Recreate that view
          # in CI by soft-resetting HEAD to the change base, which leaves this PR's (or
          # push's) commits staged in the index — so the exact same checks that gate a
          # local `git commit` run here, with no edits to the validator.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to the parent commit if the base ref is missing (e.g. first push,
          # or an all-zero SHA for a new branch).
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          git reset --soft "$BASE"
          python scripts/utils/pre_commit_validator.py

  # Ruff runs in its OWN job so `quality-gate` stays deliberately dependency-free.
  # ruff is a single self-contained binary (no transitive deps), pinned for a
  # reproducible gate — a floating version could turn CI red with no code change.
  # It enforces the whole-repo rule set in pyproject.toml (notably E402 no-inline-imports
  # and E722 no-bare-except). The 305 pre-existing violations are parked in the
  # pyproject `ignore` block and tightened per the "Enable Ruff Enforcement" R&D item.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Ruff (pinned)
        run: pip install ruff==0.16.1

      - name: Ruff check (config in pyproject.toml)
        run: ruff check .

  # The full unit suite: behaviour golden, audit logs, stage tests, everything under tests/.
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the pinned test dependencies
        # ruff too (same pin as the lint job): test_executables lints daily_task.py with it.
        run: python -m pip install -r requirements-ci.txt ruff==0.16.1

      - name: Unit suite
        run: python -m unittest discover -s tests
